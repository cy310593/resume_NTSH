
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中韓中日翻譯系統</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ccc;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #3478db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #245da8;
        }

        .clear {
            background: #777;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #eef5ff;
            border-radius: 8px;
            text-align: left;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>中韓中日翻譯系統</h1>

    <form method="POST" action="/ask">

        <label>選擇翻譯語言：</label>

        <select name="language">
            <option value="ko"
                {% if language == 'ko' %}selected{% endif %}>
                韓文
            </option>

            <option value="jp"
                {% if language == 'jp' %}selected{% endif %}>
                日文
            </option>
        </select>

        <label>請輸入中文：</label>

        <input
            type="text"
            name="question"
            value="{{ question or '' }}"
            placeholder="請輸入要翻譯的中文"
            required
        >

        <button type="submit">開始翻譯</button>

    </form>

    <form method="GET" action="/">
        <button type="submit" class="clear">
            清除內容
        </button>
    </form>

    {% if answer %}

    <div class="result">

        <h2>翻譯結果</h2>

        <p>
            <strong>原文：</strong>
            {{ question }}
        </p>

        <p>
            <strong>翻譯：</strong>
            {{ answer }}
        </p>

    </div>

    {% endif %}

</div>

</body>
</html>
